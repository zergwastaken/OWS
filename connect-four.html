<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWS - Connect 4</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Specific styles for the Connect 4 grid */
    .c4-board {
      display: grid;
      grid-template-columns: repeat(7, 1fr); /* 7 equal columns */
      gap: clamp(4px, 1.5vmin, 12px);
      
      background-color: #2980b9; 
      padding: clamp(8px, 2vmin, 15px);
      border-radius: 12px;
      box-shadow: var(--shadow-main);
      border: 4px solid #1a5276;
      
      /* 
        THE FIX: The board's height is now constrained by the parent container (.split-layout),
        which is already calculated to fit the screen. This allows the board to be as tall as possible.
        The aspect-ratio of the cells will handle the width automatically.
      */
      height: 100%;
      max-height: 85vh;
    }

    .c4-cell {
      aspect-ratio: 1 / 1; /* FORCES perfect circles */
      background-color: var(--bg-dark); /* Color of empty holes */
      border-radius: 50%;
      cursor: pointer;
      box-shadow: inset 0 5px 10px rgba(0,0,0,0.7);
      transition: opacity 0.2s ease;
    }

    .c4-cell:hover { 
      opacity: 0.7; 
    }

    /* Player Pieces */
    .c4-red { 
      background-color: #ff4757; 
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.4), 0 3px 5px rgba(0,0,0,0.5); 
    }
    .c4-yellow { 
      background-color: #f1c40f; 
      box-shadow: inset 0 -4px 10px rgba(0,0,0,0.4), 0 3px 5px rgba(0,0,0,0.5); 
    }
  </style>
</head>
<body>

  <script src="nav.js"></script>
  <div id="nav-placeholder"></div>

  <!-- Using the same split-layout as the chess page -->
  <div class="split-layout">
    
    <!-- LEFT SIDE: Controls -->
    <div class="side-panel">
      <h1>Connect 4</h1>
      
      <div class="status-box" id="status" style="color: #ff4757;">Red's Turn</div>

      <button onclick="resetGame()">Restart Game</button>
    </div>

    <!-- RIGHT SIDE: The Maximized Game Board -->
    <div class="c4-board" id="board">
        <!-- Cells are injected via JavaScript -->
    </div>

  </div>

  <script>
    const ROWS = 6;
    const COLS = 7;
    let currentPlayer = 'red';
    let boardState = [];
    let gameActive = true;

    const boardElement = document.getElementById('board');
    const statusElement = document.getElementById('status');

    function initBoard() {
      boardElement.innerHTML = '';
      boardState = Array(ROWS).fill(null).map(() => Array(COLS).fill(null));
      
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.createElement('div');
          cell.classList.add('c4-cell');
          cell.dataset.row = r;
          cell.dataset.col = c;
          cell.addEventListener('click', () => handleDrop(c));
          boardElement.appendChild(cell);
        }
      }
    }

    function handleDrop(col) {
      if (!gameActive) return;

      for (let r = ROWS - 1; r >= 0; r--) {
        if (!boardState[r][col]) {
          boardState[r][col] = currentPlayer;
          updateUI();
          
          if (checkWin(r, col)) {
            statusElement.innerText = `${currentPlayer === 'red' ? 'Red' : 'Yellow'} Wins!`;
            gameActive = false;
            return;
          }

          if (checkDraw()) {
            statusElement.innerText = "It's a Draw!";
            statusElement.style.color = "var(--text-main)";
            gameActive = false;
            return;
          }

          currentPlayer = currentPlayer === 'red' ? 'yellow' : 'red';
          statusElement.innerText = `${currentPlayer === 'red' ? 'Red' : 'Yellow'}'s Turn`;
          statusElement.style.color = currentPlayer === 'red' ? '#ff4757' : '#f1c40f';
          return;
        }
      }
    }

    function updateUI() {
      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const cell = document.querySelector(`.c4-cell[data-row='${r}'][data-col='${c}']`);
          cell.className = 'c4-cell';
          if (boardState[r][c]) {
            cell.classList.add(`c4-${boardState[r][c]}`);
          }
        }
      }
    }

    function checkWin(row, col) {
      const directions = [
        [ [0, -1], [0, 1] ],   // Horizontal
        [ [-1, 0], [1, 0] ],   // Vertical 
        [ [-1, -1], [1, 1] ],  // Diagonal \ 
        [ [-1, 1], [1, -1] ]   // Diagonal / 
      ];

      for (let dir of directions) {
        let count = 1;
        for (let step of dir) {
          let r = row + step[0];
          let c = col + step[1];
          while (r >= 0 && r < ROWS && c >= 0 && c < COLS && boardState[r][c] === currentPlayer) {
            count++;
            r += step[0];
            c += step[1];
          }
        }
        if (count >= 4) return true;
      }
      return false;
    }

    function checkDraw() {
      return boardState[0].every(cell => cell !== null);
    }

    function resetGame() {
      currentPlayer = 'red';
      gameActive = true;
      statusElement.innerText = "Red's Turn";
      statusElement.style.color = "#ff4757";
      initBoard();
    }

    initBoard();
  </script>
</body>
</html>
