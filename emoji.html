  <style>
    /* Emoji Puzzle Board Styles */
    .emoji-board {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-panel);
      border: 4px solid var(--bg-component);
      border-radius: 6px;
      box-shadow: var(--shadow-main);
      padding: 30px;
      gap: 20px;
      width: clamp(300px, 80vh, 70vw);
      aspect-ratio: 1 / 1; 
    }
    .emoji-display {
      font-size: clamp(3em, 8vmin, 4.5em);
      background: var(--bg-dark);
      padding: 20px 40px;
      border-radius: 12px;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.8);
      border: 2px solid #444;
      text-align: center;
      letter-spacing: 0.1em;
      min-width: 80%;
      line-height: 1.2;
    }
    .guess-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      width: 80%;
      align-items: stretch;
    }
    .guess-input {
      background: var(--bg-dark);
      border: 2px solid #555;
      border-radius: 8px;
      padding: 12px;
      font-size: 1.3em;
      color: white;
      text-align: center;
      width: 100%;
      font-weight: bold;
      transition: border-color 0.2s;
    }
    .guess-input:focus {
      outline: none;
      border-color: var(--primary-color);
    }
    .category-tag {
      font-size: clamp(0.9em, 2vh, 1.2em);
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--primary-color);
      font-weight: bold;
    }
    .hint-text {
      font-size: clamp(1em, 2vh, 1.3em);
      color: var(--text-muted);
      font-style: italic;
      height: 30px;
      text-align: center;
    }
    .revealed-answer {
      font-size: 1.2em;
      color: #2ecc71;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      height: 30px;
    }
  </style>

  <script>
    // ==========================================
    // 2. GAME STATE
    // ==========================================
    let currentPuzzleIndex = 0;
    let shuffledPuzzles = [];
    let scores = { p1: 0, p2: 0 };
    let activePlayer = 'p1';
    let hintUsed = false;

    const $emojis = $('#emojis');
    const $category = $('#category');
    const $hint = $('#hint');
    const $guessInput = $('#guessInput');
    const $resultMessage = $('#resultMessage');
    const $turnIndicator = $('#turnIndicator');

    // ==========================================
    // 3. GAMEPLAY LOGIC
    // ==========================================
    function loadPuzzle() {
      hintUsed = false;
      $resultMessage.text('');
      $guessInput.val('').prop('disabled', false);
      $guessInput.focus();
      
      const p = shuffledPuzzles[currentPuzzleIndex];
      $emojis.text(p.emojis);
      $category.text(`Category: ${p.category}`);
      $hint.text('Press the orange button if you need a clue!');
      
      updateTurnIndicator();
    }

    function updateTurnIndicator() {
      const playerText = activePlayer === 'p1' ? "Player 1's Turn" : "Player 2's Turn";
      $turnIndicator.text(playerText);
      $turnIndicator.css('color', activePlayer === 'p1' ? '#ff4757' : '#1e90ff');
      
      if (activePlayer === 'p1') {
        $('#p1Score').addClass('active-timer');
        $('#p2Score').removeClass('active-timer');
      } else {
        $('#p2Score').addClass('active-timer');
        $('#p1Score').removeClass('active-timer');
      }
    }

    function checkAnswer() {
      const rawGuess = $guessInput.val().trim().toLowerCase();
      const correctAnswer = shuffledPuzzles[currentPuzzleIndex].answer.toLowerCase();

      if (rawGuess === correctAnswer) {
        const pointsEarned = hintUsed ? 8 : 10;
        scores[activePlayer] += pointsEarned;
        
        $('#p1Score .time-text').text(scores.p1);
        $('#p2Score .time-text').text(scores.p2);
        
        $resultMessage.css('color', '#2ecc71').text(`CORRECT! +${pointsEarned} Points`);
        $guessInput.prop('disabled', true);

        setTimeout(() => {
          nextPuzzle();
        }, 1500);
      } else {
        $resultMessage.css('color', '#ff4757').text('Try Again!');
        setTimeout(() => $resultMessage.text(''), 1000);
      }
    }

    function nextPuzzle() {
      currentPuzzleIndex++;
      if (currentPuzzleIndex >= shuffledPuzzles.length) {
          // End of the shuffled list, reshuffle and start over
          currentPuzzleIndex = 0;
          shufflePuzzles();
      }
      switchTurn();
      loadPuzzle();
    }

    function switchTurn() {
      activePlayer = activePlayer === 'p1' ? 'p2' : 'p1';
    }
    
    function shufflePuzzles() {
        // Fisher-Yates Shuffle Algorithm for true randomization
        shuffledPuzzles = [...puzzles];
        for (let i = shuffledPuzzles.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [shuffledPuzzles[i], shuffledPuzzles[j]] = [shuffledPuzzles[j], shuffledPuzzles[i]];
        }
    }

    // ==========================================
    // 4. ACTION CONTROLS & LISTENERS
    // ==========================================
    $('#submitBtn').on('click', checkAnswer);
    $guessInput.on('keypress', function(e) {
      if (e.which === 13) checkAnswer();
    });

    $('#hintBtn').on('click', function() {
      if (hintUsed) return;
      hintUsed = true;
      scores[activePlayer] -= 2; // Penalize for using hint
      $('#p1Score .time-text').text(scores.p1);
      $('#p2Score .time-text').text(scores.p2);
      
      const ans = shuffledPuzzles[currentPuzzleIndex].answer;
      const hiddenClue = ans.split(' ').map(word => {
        return word.charAt(0).toUpperCase() + "_ ".repeat(word.length - 1).trim();
      }).join('   ');
      
      $hint.html(`Clue: <strong style="color:var(--accent-orange);">${hiddenClue}</strong>`);
    });

    $('#skipBtn').on('click', function() {
        $resultMessage.css('color', '#f1c40f').text(`Answer: ${shuffledPuzzles[currentPuzzleIndex].answer}`);
        setTimeout(() => {
          nextPuzzle();
        }, 2000);
    });

    function resetGame() {
      shufflePuzzles();
      currentPuzzleIndex = 0;
      scores = { p1: 0, p2: 0 };
      activePlayer = 'p1';
      
      $('#p1Score .time-text').text(0);
      $('#p2Score .time-text').text(0);
      
      loadPuzzle();
    }

    $('#resetBtn').on('click', resetGame);

    // Initial Load
    resetGame();
  </script>
