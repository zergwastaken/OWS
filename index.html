<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OWS - Home</title>
  <link rel="stylesheet" href="style.css">
  
  <style>
    /* Specific styles for the game selection grid */
    .directory-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      height: 100%;
      padding-top: 40px;
    }

    .directory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
      width: 100%;
      max-width: 900px;
      margin-top: 30px;
      padding: 20px;
    }

    .game-card {
      background: var(--bg-panel);
      border: 2px solid var(--bg-component);
      border-radius: 12px;
      padding: 40px 20px;
      text-align: center;
      text-decoration: none;
      color: var(--text-main);
      font-weight: bold;
      font-size: 1.5em;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      box-shadow: var(--shadow-subtle);
    }

.game-card p{
	      font-size: .5em;
	color: grey;

}

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-main);
      border-color: var(--primary-color);
      background: var(--bg-component);
    }

    .card-icon {
      font-size: 2.5em;
      margin-bottom: 15px;
      display: block;
    }

footer {
	color: grey
}
  </style>
</head>
<body>
  <script src="nav.js"></script>
  <div id="nav-placeholder"></div>
  <div class="directory-wrapper">
        <div style="text-align: center;">
            <h1 style="font-size: 3em; color: var(--primary-color);">"Choose your battleground"</h1>
            <p style="color: var(--text-muted); font-size: 1.2em;">~ OS1 Charles</p>
        </div>

        <!-- The Grid of Games -->
        <div class="directory-grid">
            <a href="chess.html" class="game-card">
                <span class="card-icon">♞</span>
                Chess
		<p>OS1 Delaney currently undefeated</p>
            </a>
            <a href="checkers.html" class="game-card">
                <span class="card-icon">▀▄</span>
                Checkers
		<p>Broke Chess</p>
            </a>
            <a href="pong.html" class="game-card">
                <span class="card-icon">🏓</span>
                Pong
		<p>BING BONGG</p>
            </a>
            <a href="connect-four.html" class="game-card">
                <span class="card-icon">🔴</span>
                Connect 4
		<p>4 in a row</p>
            </a>
            <a href="tictactoe.html" class="game-card">
                <span class="card-icon">❌</span>
                Tic-Tac-Toe
		<p>3 in a row</p>
            </a>
            <a href="emoji.html" class="game-card">
                <span class="card-icon">🤔</span>
                Emoji Guess
		<p>Guess emoji word thing</p>
            </a>
        </div>
    </div>
	<footer>made by david m grinager</footer>
</body>
</html>
