<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Battleship - OnWatchShenanigans</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* All styles are the same as the last version, the fix is in the JavaScript. */
    .game-boards-container { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }
    .game-boards { display: flex; gap: 30px; justify-content: center; width: 100%; }
    .bs-board-wrapper { display: flex; flex-direction: column; align-items: center; }
    .bs-board-wrapper h3 { margin-bottom: 10px; font-size: 1.1em; letter-spacing: 1px; color: var(--text-muted); }
    .bs-grid { display: grid; grid-template-columns: repeat(10, 1fr); grid-template-rows: repeat(10, 1fr); border: 4px solid var(--bg-component); border-radius: 8px; box-shadow: var(--shadow-main); background-color: #0c1524; width: clamp(300px, 80vh, 70vw); aspect-ratio: 1 / 1; position: relative; }
    .bs-cell { border: 1px solid rgba(0, 122, 204, 0.15); display: flex; justify-content: center; align-items: center; position: relative; }
    .bs-peg { width: 35%; height: 35%; border-radius: 50%; background-color: transparent; transition: all 0.2s ease; box-shadow: inset 0 2px 4px rgba(0,0,0,0.5); }
    .bs-ship .bs-peg { background-color: #8e9eab; box-shadow: 0 0 10px rgba(142, 158, 171, 0.5), inset 0 -3px 5px rgba(0,0,0,0.4); width: 45%; height: 45%; }
    .bs-hit .bs-peg { background-color: #ff4757; box-shadow: 0 0 15px #ff4757, inset 0 -3px 5px rgba(0,0,0,0.4); width: 45%; height: 45%; }
    .bs-miss .bs-peg { background-color: #4a5d6e; box-shadow: inset 0 2px 4px rgba(0,0,0,0.8); width: 20%; height: 20%; }
    .bs-sunk { background-color: rgba(127, 140, 141, 0.15); }
    .bs-sunk .bs-peg { background-color: #555; box-shadow: none; }
    #target-grid .bs-cell:hover { background-color: rgba(0, 122, 204, 0.25); cursor: crosshair; }
    .preview-valid { background-color: rgba(46, 204, 113, 0.1) !important; }
    .preview-valid .bs-peg { background-color: #2ecc71; box-shadow: 0 0 15px #2ecc71; width: 40%; height: 40%; }
    .preview-invalid { background-color: rgba(231, 76, 60, 0.1) !important; }
    .preview-invalid .bs-peg { background-color: #e74c3c; box-shadow: 0 0 15px #e74c3c; width: 40%; height: 40%; }
    #ghost-ship { position: absolute; border-radius: 5px; pointer-events: none; display: none; transition: all 0.05s linear; }
    .ghost-valid { background-color: rgba(46, 204, 113, 0.3); border: 1px solid #2ecc71; }
    .ghost-invalid { background-color: rgba(231, 76, 60, 0.3); border: 1px solid #e74c3c; }
    .fleet-status ul { list-style: none; padding-left: 0; }
    .fleet-status li { padding: 4px 0; color: var(--text-muted); transition: color 0.3s; font-size: 0.95em; }
    .fleet-status li.sunk { text-decoration: line-through; color: #555; }
    .fleet-status li.placing { color: var(--accent-orange); font-weight: bold; }
    #turn-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: rgba(12, 21, 36, 0.98); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; text-align: center; backdrop-filter: blur(8px); }
    #turn-overlay h2 { font-size: 3.5em; text-transform: uppercase; color: var(--primary-color); text-shadow: 0 0 20px rgba(0, 122, 204, 0.4); }
    #turn-overlay p { font-size: 1.5em; color: var(--text-muted); margin-bottom: 30px; }
  </style>
</head>
<body>

  <!-- UI Structure is identical -->
  <div id="turn-overlay"><h2 id="overlay-player">PASS TO PLAYER 2</h2><p id="overlay-instruction">Opponent is setting up. Look away!</p><button id="overlay-button">I Am Ready</button></div>
  <div class="directory-tabs"><h1>Arcade</h1><div class="tabs"><a href="index.html">Home</a><a href="directory.html">Directory</a><a href="battleship.html">Battleship</a></div></div>
  <div class="split-layout">
    <div class="side-panel"><h1>BATTLESHIP</h1><div class="status-box" id="status">Player 1, place your Carrier.</div><div id="placement-controls" class="setup-box"><button id="rotate-button" style="width: 100%;">Rotate (Horizontal)</button></div><div id="fleet-trackers"><div class="timer fleet-status"><span class="timer-label">Your Fleet</span><ul id="player-fleet-status"></ul></div><div class="timer fleet-status" style="display:none;" id="enemy-fleet-container"><span class="timer-label">Enemy Fleet</span><ul id="enemy-fleet-status"></ul></div></div><button id="reset-button">Reset Game</button></div>
    <div class="game-boards-container"><div class="game-boards"><div class="bs-board-wrapper" id="player-board-container"><h3>YOUR FLEET</h3><div class="bs-grid" id="player-grid"><div id="ghost-ship"></div></div></div><div class="bs-board-wrapper" id="target-board-container" style="display:none;"><h3>TARGETING GRID</h3><div class="bs-grid" id="target-grid"></div></div></div></div>
  </div>

  <script>
    $(document).ready(function() {
        const GRID_SIZE = 10;
        const SHIPS_CONFIG = [ { name: "Carrier", size: 5 }, { name: "Battleship", size: 4 }, { name: "Cruiser", size: 3 }, { name: "Submarine", size: 3 }, { name: "Destroyer", size: 2 } ];
        let p1Board, p2Board, p1Ships, p2Ships, gameState, placementIndex, isHorizontal, lastHoveredCell = {r:0, c:0};
        
        function initializeGame() {
            p1Board = createGrid(); p2Board = createGrid();
            p1Ships = createShipObjects(); p2Ships = createShipObjects();
            gameState = 'P1_PLACE'; placementIndex = 0; isHorizontal = true;
            $('#status').text('Player 1, place your Carrier.');
            $('#rotate-button').text('Rotate (Horizontal)').show();
            $('#target-board-container, #enemy-fleet-container').hide();
            updateFleetStatusUI('player', p1Ships);
            drawGrid('player-grid', p1Board, true);
        }

        function createGrid() { return Array.from({ length: GRID_SIZE }, () => Array.from({ length: GRID_SIZE }, () => ({ shipId: null, hit: false }))); }
        function createShipObjects() { return SHIPS_CONFIG.map((ship, index) => ({ ...ship, id: index, sunk: false, placed: false, cells: [] })); }

        function drawGrid(gridId, boardData, showShips) {
            const $grid = $(`#${gridId}`).empty();
            // Re-add the ghost ship to the player grid after clearing it
            if (gridId === 'player-grid') $grid.append('<div id="ghost-ship"></div>');
            
            for (let r = 0; r < GRID_SIZE; r++) {
                for (let c = 0; c < GRID_SIZE; c++) {
                    const cellData = boardData[r][c];
                    const $cell = $('<div>').addClass('bs-cell').data({ r, c });
                    const $peg = $('<div>').addClass('bs-peg');
                    $cell.append($peg);
                    if (cellData.hit) { $cell.addClass(cellData.shipId !== null ? 'bs-hit' : 'bs-miss'); } 
                    else if (showShips && cellData.shipId !== null) { $cell.addClass('bs-ship'); }
                    $grid.append($cell);
                }
            }
        }
        
        function updateFleetStatusUI(listId, shipsData) { /* Logic remains the same */ }
        function showTurnOverlay(nextState) { /* Logic remains the same */ }
        function checkWinCondition() { /* Logic remains the same */ }

        $('#rotate-button').on('click', () => {
            isHorizontal = !isHorizontal;
            $('#rotate-button').text(`Rotate (${isHorizontal ? 'Horizontal' : 'Vertical'})`);
            $('#player-grid').trigger('mousemove'); 
        });

        // --- THE FIX: HYBRID GHOST SHIP + PEG HIGHLIGHTING ---
        $('#player-grid').on('mousemove', function(e) {
            if (!gameState.includes('PLACE')) return;

            // --- Ghost Ship Logic ---
            const $grid = $(this);
            const gridOffset = $grid.offset();
            const cellWidth = $grid.width() / GRID_SIZE;
            const cellHeight = $grid.height() / GRID_SIZE;
            const x = e.pageX - gridOffset.left;
            const y = e.pageY - gridOffset.top;
            const r = Math.floor(y / cellHeight);
            const c = Math.floor(x / cellWidth);
            
            // --- Peg Highlighting Logic ---
            $('.bs-cell').removeClass('preview-valid preview-invalid');
            
            const ship = SHIPS_CONFIG[placementIndex];
            const board = gameState === 'P1_PLACE' ? p1Board : p2Board;
            let isValid = true;
            let cellsToHighlight = [];

            for(let i=0; i < ship.size; i++){
                const curR = r + (isHorizontal ? 0 : i);
                const curC = c + (isHorizontal ? i : 0);
                if(curR >= GRID_SIZE || curC >= GRID_SIZE || board[curR][curC].shipId !== null) {
                    isValid = false;
                }
                cellsToHighlight.push({r: curR, c: curC});
            }
            
            // Apply highlighting to both ghost ship and pegs
            cellsToHighlight.forEach(cell => {
                if(cell.r < GRID_SIZE && cell.c < GRID_SIZE){
                    $(`#player-grid .bs-cell[data-r=${cell.r}][data-c=${cell.c}]`).addClass(isValid ? 'preview-valid' : 'preview-invalid');
                }
            });
            
            const $ghost = $('#ghost-ship');
            $ghost.css({
                display: 'block',
                width: cellWidth * (isHorizontal ? ship.size : 1) - 2,
                height: cellHeight * (isHorizontal ? 1 : ship.size) - 2,
                left: c * cellWidth + 1,
                top: r * cellHeight + 1
            }).removeClass('ghost-valid ghost-invalid').addClass(isValid ? 'ghost-valid' : 'ghost-invalid');

            lastHoveredCell = {r, c};

        }).on('mouseleave', function() {
            $('#ghost-ship').hide();
            $('.bs-cell').removeClass('preview-valid preview-invalid');
        });

        $('#player-grid').on('click', function() {
            if (!gameState.includes('PLACE') || $('#ghost-ship').hasClass('ghost-invalid')) return;
            
            const { r, c } = lastHoveredCell;
            const ship = SHIPS_CONFIG[placementIndex];
            const [board, shipsData] = gameState === 'P1_PLACE' ? [p1Board, p1Ships] : [p2Board, p2Ships];

            for(let i=0; i < ship.size; i++){
                const curR = r + (isHorizontal ? 0 : i);
                const curC = c + (isHorizontal ? i : 0);
                board[curR][curC].shipId = ship.id;
                shipsData[placementIndex].cells.push({r: curR, c: curC});
            }
            shipsData[placementIndex].placed = true;
            
            $('#ghost-ship').hide();
            drawGrid('player-grid', board, true);

            placementIndex++;
            updateFleetStatusUI('player', shipsData);

            if(placementIndex >= SHIPS_CONFIG.length){
                if(gameState === 'P1_PLACE') { showTurnOverlay('P2_PLACE'); } 
                else { $('#rotate-button').hide(); showTurnOverlay('P1_TURN'); }
            } else {
                 $('#status').text(`Player ${gameState.includes('P1') ? 1:2}, place your ${SHIPS_CONFIG[placementIndex].name}.`);
            }
        });
        
        $('#target-grid').on('click', '.bs-cell', function() { /* Logic remains the same */ });
        $('#reset-button').on('click', initializeGame);

        initializeGame();
    });
  </script>
</body>
</html>
